[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "othello"
version = "0.1.0"
description = "On-device Othello: Python rules core, local server and offline web UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
othello = "othello.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/othello"]
